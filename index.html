<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040406">
<meta name="color-scheme" content="dark">
<meta name="description" content="ระบบจัดการสัญญาผ่อนชำระและติดตามการชำระเงิน">
<meta name="application-name" content="PayNest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>PayNest Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icon/icon-192.png">
<meta name="theme-color" content="#040406">

</head>

<body>

<a class="skip-link" href="#view">ข้ามไปยังเนื้อหาหลัก</a>

<div id="app">

  <!-- ==============================
       TOP BAR
       V2 keeps the original hooks used by app.js.
  =============================== -->
  <header class="topbar" role="banner">
    <div>
      <div class="brand">PAYNEST</div>
      <h1 id="pageTitle">ภาพรวม</h1>
    </div>

    <div style="display:flex;gap:8px;align-items:center">
      <button class="icon-btn" id="cloudAccount" type="button" aria-label="เข้าสู่ระบบ PayNest Cloud" title="เข้าสู่ระบบ PayNest Cloud">☁</button>
      <button class="icon-btn" id="installApp" type="button" aria-label="ติดตั้ง PayNest" title="ติดตั้ง PayNest" hidden>⇩</button>
      <button
        class="icon-btn"
        id="topAction"
        type="button"
        aria-label="ขึ้นด้านบน"
        title="ขึ้นด้านบน"
      >↑</button>
    </div>
  </header>

  <!-- ==============================
       MAIN VIEW
  =============================== -->
  <main id="view" role="main" tabindex="-1"></main>

  <!-- ==============================
       FLOATING ACTION BUTTON
  =============================== -->
  <button
    class="fab"
    id="fab"
    type="button"
    aria-label="เพิ่มรายการ"
    aria-haspopup="dialog"
  >
    <span aria-hidden="true">+</span>
    <small id="fabLabel">สัญญา</small>
  </button>

  <!-- ==============================
       BOTTOM NAVIGATION
  =============================== -->
  <nav class="bottom-nav" aria-label="เมนูหลัก">
    <button type="button" data-page="dashboard" class="nav-item active" aria-label="ภาพรวม">
      <span aria-hidden="true">⌂</span>
      <small>ภาพรวม</small>
    </button>

    <button type="button" data-page="contracts" class="nav-item" aria-label="สัญญา">
      <span aria-hidden="true">▣</span>
      <small>สัญญา</small>
    </button>

    <button type="button" data-page="customers" class="nav-item" aria-label="ลูกค้า">
      <span aria-hidden="true">♙</span>
      <small>ลูกค้า</small>
    </button>

    <button type="button" data-page="settings" class="nav-item" aria-label="ตั้งค่า">
      <span aria-hidden="true">⚙</span>
      <small>ตั้งค่า</small>
    </button>
  </nav>

</div>

<!-- ==============================
     MODAL ROOT
=============================== -->
<div id="modalRoot" aria-live="polite"></div>

<!-- ==============================
     IMPORT
=============================== -->
<input
  id="importFile"
  type="file"
  accept=".json,application/json"
  hidden
>

<noscript>
  <div style="padding:24px;font-family:sans-serif;background:#09090a;color:#fff;min-height:100vh">
    PayNest ต้องเปิดใช้งาน JavaScript เพื่อให้ระบบทำงานได้ครบถ้วน
  </div>
</noscript>

<!-- ==============================
     APP
=============================== -->
<script type="module" src="./app.js"></script>
<script src="./pwa-install.js" defer></script>


</body>
</html>
