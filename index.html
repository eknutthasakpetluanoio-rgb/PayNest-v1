<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#09090a"
>

<meta
  name="description"
  content="PayNest v1 ระบบจัดการสัญญาผ่อนชำระ"
>

<title>PayNest Premium</title>

<link
  rel="stylesheet"
  href="style.css?v=20260812-premium1-5"
>

</head>

<body>

<div id="app">

  <!-- ==============================
       TOP BAR
  =============================== -->

  <header class="topbar">

    <div>

      <div class="brand">
        PAYNEST
      </div>

      <h1 id="pageTitle">
        ภาพรวม
      </h1>

    </div>

    <button
      class="icon-btn"
      id="topAction"
      aria-label="ขึ้นด้านบน"
    >
      ↑
    </button>

  </header>


  <!-- ==============================
       MAIN VIEW
  =============================== -->

  <main id="view"></main>


  <!-- ==============================
       FLOATING ACTION BUTTON
  =============================== -->

  <button
    class="fab"
    id="fab"
    aria-label="เพิ่มรายการ"
  >

    <span>+</span>

    <small id="fabLabel">
      สัญญา
    </small>

  </button>


  <!-- ==============================
       BOTTOM NAVIGATION
  =============================== -->

  <nav
    class="bottom-nav"
    aria-label="เมนูหลัก"
  >

    <button
      data-page="dashboard"
      class="nav-item active"
    >
      <span>⌂</span>
      <small>ภาพรวม</small>
    </button>

    <button
      data-page="contracts"
      class="nav-item"
    >
      <span>▣</span>
      <small>สัญญา</small>
    </button>

    <button
      data-page="customers"
      class="nav-item"
    >
      <span>♙</span>
      <small>ลูกค้า</small>
    </button>

    <button
      data-page="settings"
      class="nav-item"
    >
      <span>⚙</span>
      <small>ตั้งค่า</small>
    </button>

  </nav>

</div>


<!-- ==============================
     MODAL ROOT
=============================== -->

<div id="modalRoot"></div>


<!-- ==============================
     IMPORT
=============================== -->

<input
  id="importFile"
  type="file"
  accept=".json,application/json"
  hidden
>


<!-- ==============================
     APP
=============================== -->

<script
  type="module"
  src="app.js"
></script>

</body>
</html>
