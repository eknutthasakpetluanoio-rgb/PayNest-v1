<!-- ส่วนปุ่มสำรองและกู้คืนข้อมูล -->
<div class="card settings-card" style="margin-top: 16px;">
  <h2>สำรองข้อมูลร้านค้า</h2>
  <p>ดาวน์โหลดข้อมูลสัญญาและลูกค้าเก็บไว้ในเครื่อง หรือกู้คืนข้อมูลเดิมเมื่อเปลี่ยนอุปกรณ์</p>
  
  <div class="button-row" style="display: flex; gap: 10px; margin-top: 14px;">
    <button onclick="exportData()" class="wide-btn" style="margin-top: 0; background: #fff; color: #000;">📥 สำรองข้อมูล (Export)</button>
    <label for="importFile" class="wide-btn" style="margin-top: 0; text-align: center; display: block; cursor: pointer; background: rgba(255,255,255,0.08);">📤 กู้คืนข้อมูล (Import)</label>
    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
  </div>
</div>
